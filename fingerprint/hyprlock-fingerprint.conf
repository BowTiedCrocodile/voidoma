auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Fingerprint Unlock Enabled
    fingerprint:present_message = Checking fingerprint...
}
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(a7c080ff)
    font_size = 14
    font_family = DejaVu Sans Mono
    position = 0, -110
    halign = center
    valign = center
}
